description = "ponytail:コメントを追跡可能な負債台帳へ集める"
prompt = "このリポジトリのすべてのponytail:コメントを負債台帳へ集める。grep -rnE '(#|//) ?ponytail:' .でツリー全体を検索し、node_modules、.git、ビルド出力は除外する。ファイルごとに、<ファイル>:<行> — <何を簡略化したか>。ceiling: <コメントに書かれた上限>。upgrade: <見直す条件>。を1行ずつ出す。改善条件や見直すきっかけがないものにはno-triggerを付ける。最後に総数とno-triggerの数を出す。なければNo ponytail: debt. Clean ledger.と出し、報告だけで変更しない。"

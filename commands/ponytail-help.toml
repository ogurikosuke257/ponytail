description = "Ponytailのレベル、スキル、コマンドのクイックリファレンス"
prompt = "Ponytailのクイックリファレンスを表示する。1回限りで、モード変更、フラグファイルへの書き込み、永続化はしない。レベルは/ponytail lite（要求されたものを作り、1行で怠惰な代替案を示す）、/ponytail（full、YAGNI→標準ライブラリ→標準機能→1行→最小実装の既定段階表）、/ponytail ultra（追加より削除、作る前に要件へ問いを返す）。コマンドは/ponytail-review（現在の変更の過剰設計レビュー）、/ponytail-audit（リポジトリ全体の監査）、/ponytail-debt（ponytail:コメントの台帳化）、/ponytail-gain（ベンチマーク効果）、/ponytail-help（このカード）。stop ponytail、normal mode、/ponytail offで無効化し、/ponytailで再開する。既定値はfullで、PONYTAIL_DEFAULT_MODEまたは~/.config/ponytail/config.json（Windowsは%APPDATA%\\ponytail\\config.json）で変更できる。解決順序は環境変数、設定ファイル、full。"

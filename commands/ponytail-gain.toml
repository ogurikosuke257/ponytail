description = "Ponytailの測定済み効果をスコアボードで表示する"
prompt = "Ponytailの効果スコアボードを表示する。1回限りで、モード変更、フラグファイルへの書き込み、永続化はしない。benchmarks/とREADMEの公開中央値（5タスク、Haiku・Sonnet・Opus）をASCIIバーで表示する。コード行数はno-skill 100%対ponytail 6–20%（80–94%削減）、コストはno-skill 100%対ponytail 23–53%（47–77%削減）、速度は3–6倍高速。バーの長さは測定範囲、ラベルは正確な値を示す。これはベンチマークの中央値であり、このリポジトリの節約量ではない。未実装版は存在しないため、リポジトリ単位の節約量を絶対に出さない。実際のリポジトリ単位の値は/ponytail-debt（ショートカット台帳）と/ponytail-audit（まだ削れるもの）へ案内する。報告だけにする。"
